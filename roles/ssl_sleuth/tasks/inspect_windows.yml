---
# Native .NET SslStream probe — no external tools, works for localhost.
# Emits JSON; the same analysis fields as the linux path.
#
# Proxy: SslStream has no proxy notion, so the CONNECT tunnel is done by
# hand on the raw TcpClient stream (mirroring openssl s_client -proxy on
# linux): send the request, read the status line and headers byte by byte
# up to the blank line, require a 2xx, then hand the same stream to
# SslStream. Injected values are single-quoted with embedded quotes doubled
# (the doubling lives in vars, not in the script body, because the win_shell
# free-form splitter counts apostrophes there).

- name: Probe the endpoint with SslStream
  vars:
    _p_host: "{{ _ssl_sleuth_proxy.host | replace(\"'\", \"''\") }}"
    _p_user: "{{ _ssl_sleuth_proxy.username | replace(\"'\", \"''\") }}"
    _p_pass: "{{ _ssl_sleuth_proxy.password | replace(\"'\", \"''\") }}"
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $targetHost = '{{ ssl_sleuth_host }}'
    $port = {{ ssl_sleuth_port }}
    $sni = '{{ ssl_sleuth_sni }}'
    if (-not $sni) { $sni = $targetHost }
    $warnDays = {{ ssl_sleuth_expiry_warn_days }}
    $proxyHost = '{{ _p_host }}'
    $proxyPort = {{ _ssl_sleuth_proxy.port | int }}
    $proxyUser = '{{ _p_user }}'
    $proxyPass = '{{ _p_pass }}'
    try {
      if ($proxyHost) {
        $tcp = New-Object Net.Sockets.TcpClient($proxyHost, $proxyPort)
        $tcp.ReceiveTimeout = 15000
        $stream = $tcp.GetStream()
        $stream.ReadTimeout = 15000
        $req = "CONNECT ${targetHost}:${port} HTTP/1.1`r`nHost: ${targetHost}:${port}`r`n"
        if ($proxyUser) {
          $token = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("${proxyUser}:${proxyPass}"))
          $req += "Proxy-Authorization: Basic ${token}`r`n"
        }
        $req += "`r`n"
        $bytes = [Text.Encoding]::ASCII.GetBytes($req)
        $stream.Write($bytes, 0, $bytes.Length)
        $resp = ''
        $buf = New-Object byte[] 1
        while (-not $resp.EndsWith("`r`n`r`n")) {
          $n = $stream.Read($buf, 0, 1)
          if ($n -le 0) { throw "proxy ${proxyHost}:${proxyPort} closed the connection during CONNECT" }
          $resp += [char]$buf[0]
          if ($resp.Length -gt 65536) { throw "proxy ${proxyHost}:${proxyPort} sent an oversized CONNECT response" }
        }
        $status = ($resp -split "`r`n")[0]
        if ($status -notmatch '^HTTP/\d(\.\d)? 2\d\d') {
          throw "proxy ${proxyHost}:${proxyPort} refused CONNECT to ${targetHost}:${port}: ${status}"
        }
      } else {
        $tcp = New-Object Net.Sockets.TcpClient($targetHost, $port)
        $stream = $tcp.GetStream()
      }
      $ssl = New-Object Net.Security.SslStream($stream, $false, {$true})
      $ssl.AuthenticateAsClient($sni)
      $leaf = New-Object Security.Cryptography.X509Certificates.X509Certificate2($ssl.RemoteCertificate)
      $chain = New-Object Security.Cryptography.X509Certificates.X509Chain
      $chain.ChainPolicy.RevocationMode = 'NoCheck'
      $null = $chain.Build($leaf)
      $out = @()
      foreach ($el in $chain.ChainElements) {
        $c = $el.Certificate
        $sans = @()
        foreach ($ext in $c.Extensions) {
          if ($ext.Oid.Value -eq '2.5.29.17') {
            # @() is load-bearing. A pipeline yielding exactly one item
            # returns that ITEM, not a one-element array, so a certificate
            # with a single SAN serialised as a JSON string rather than a
            # list, and the caller then iterated it character by character.
            # Any cert with two or more SANs was fine, which is how it
            # survived. (No apostrophes in this block: win_shell free-form
            # arg splitting treats a lone one as an unbalanced quote.)
            $sans = @(($ext.Format($false) -split ',\s*') | ForEach-Object { $_.Trim() })
          }
        }
        $bits = 0
        if ($c.PublicKey.Key) { $bits = $c.PublicKey.Key.KeySize }
        $out += [pscustomobject]@{
          subject = $c.Subject; issuer = $c.Issuer
          serial = $c.SerialNumber
          not_before = $c.NotBefore.ToString('o'); not_after = $c.NotAfter.ToString('o')
          thumbprint = $c.Thumbprint
          sha256 = ((Get-FileHash -InputStream ([IO.MemoryStream]::new($c.RawData)) -Algorithm SHA256).Hash)
          signature_algorithm = $c.SignatureAlgorithm.FriendlyName
          key_algorithm = $c.PublicKey.Oid.FriendlyName
          key_bits = $bits
          sans = $sans
          expiring = ($c.NotAfter -lt (Get-Date).AddDays($warnDays))
          expired = ($c.NotAfter -lt (Get-Date))
        }
      }
      $ssl.Dispose(); $tcp.Dispose()
      @{ok = $true; chain = $out} | ConvertTo-Json -Depth 6
    } catch {
      @{ok = $false; error = $_.Exception.Message} | ConvertTo-Json
    }
  register: _ssl_sleuth_probe_win
  changed_when: false
  no_log: "{{ _ssl_sleuth_proxy.password | length > 0 }}"

- name: Fail helpfully when the endpoint is unreachable
  vars:
    _parsed: "{{ _ssl_sleuth_probe_win.stdout | from_json }}"
  ansible.builtin.fail:
    msg: >-
      could not establish a TLS connection to
      {{ ssl_sleuth_host }}:{{ ssl_sleuth_port }}
      {{ 'via proxy ' ~ _ssl_sleuth_proxy.host ~ ':' ~ _ssl_sleuth_proxy.port
         if _ssl_sleuth_proxy.host | length > 0 else '' }}
      — {{ _parsed.error | default('unknown') }}
  when: not (_ssl_sleuth_probe_win.stdout | from_json).ok

- name: Analyze the chain
  vars:
    _parsed: "{{ _ssl_sleuth_probe_win.stdout | from_json }}"
    _chain_raw: "{{ [_parsed.chain] if _parsed.chain is mapping else _parsed.chain }}"
    _leaf: "{{ _chain_raw[0] | default({}) }}"
    _want: "{{ ssl_sleuth_sni if ssl_sleuth_sni | length > 0 else ssl_sleuth_host }}"
    _wildcard: "{{ '*.' ~ (_want.split('.')[1:] | join('.')) }}"
    _san_names: >-
      {{ _leaf.sans | default([])
         | map('regex_replace', '^(DNS Name|IP Address|DNS)[=:]', '') | map('trim') | list }}
    _warn: >-
      {{ ([] if _leaf == {} else
          (['leaf certificate EXPIRED ' ~ _leaf.not_after] if _leaf.expired else
           (['leaf certificate expires within ' ~ ssl_sleuth_expiry_warn_days
             ~ ' days (' ~ _leaf.not_after ~ ')'] if _leaf.expiring else []))
          + ([] if _want == 'localhost' or _want is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
             else [] if (_want in _san_names or _wildcard in _san_names)
             else ['hostname ' ~ _want ~ ' not covered by SANs ' ~ (_san_names | string)])
          + (['weak signature algorithm: ' ~ _leaf.signature_algorithm]
             if 'sha1' in _leaf.signature_algorithm | lower else [])
          + (['weak key: ' ~ _leaf.key_algorithm ~ ' ' ~ _leaf.key_bits ~ ' bits']
             if 'rsa' in _leaf.key_algorithm | lower and _leaf.key_bits | int < 2048 else [])) }}
  ansible.builtin.set_fact:
    ssl_sleuth_result: >-
      {{ ssl_sleuth_result
         | combine({'chain': _chain_raw,
                    'warnings': ssl_sleuth_result.warnings + _warn}) }}
